{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian+</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; }
        html { scroll-behavior: smooth; scroll-padding-top: 72px; overflow-x: hidden; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0a0a18; color: #fff; overflow-x: hidden; overflow-y: auto; }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav id="navbar" style="position:fixed;top:0;left:0;width:100%;z-index:9999;padding:14px 0;transition:background 0.3s,box-shadow 0.3s;background:rgba(10,10,24,0.0);">
  <div style="max-width:1200px;margin:0 auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
    <a href="#home" style="display:flex;align-items:center;gap:8px;text-decoration:none;">
      <div style="width:30px;height:30px;background:linear-gradient(135deg,#7c3aed,#4f46e5);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;">+</div>
      <span style="font-weight:800;font-size:18px;color:#fff;letter-spacing:-0.3px;">Guardian<span style="color:#7c3aed;">+</span></span>
    </a>
    <div style="display:flex;align-items:center;gap:32px;flex-wrap:wrap;">
      <a href="#home" class="navlink">Home</a>
      <a href="#features" class="navlink">Features</a>
      <a href="#previews" class="navlink">Screenshots</a>
      <a href="#about" class="navlink">About</a>
      <a href="#contact" class="navlink">Contact</a>
      <a href="{% static 'apk/app-debug.apk' %}" download class="nav-btn">⬇ Download APK</a>
    </div>
  </div>
</nav>

<style>
  .navlink { color:rgba(255,255,255,0.8);text-decoration:none;font-size:15px;font-weight:500;transition:color 0.2s; }
  .navlink:hover { color:#7c3aed; }
  .nav-btn { background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;padding:9px 20px;border-radius:25px;font-size:14px;font-weight:600;text-decoration:none;transition:opacity 0.2s; }
  .nav-btn:hover { opacity:0.85;color:#fff; }
</style>

<div>{% block content %}{% endblock %}</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Navbar scroll effect
  window.addEventListener('scroll', function() {
    var nav = document.getElementById('navbar');
    if (window.scrollY > 50) {
      nav.style.background = 'rgba(10,10,24,0.97)';
      nav.style.boxShadow = '0 2px 20px rgba(0,0,0,0.4)';
    } else {
      nav.style.background = 'rgba(10,10,24,0.0)';
      nav.style.boxShadow = 'none';
    }
  });

  // Smooth scroll for all nav links
  document.querySelectorAll('a[href^="#"]').forEach(function(link) {
    link.addEventListener('click', function(e) {
      var id = this.getAttribute('href');
      if (id === '#') return;
      var target = document.querySelector(id);
      if (target) {
        e.preventDefault();
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });
</script>

</body>
</html>
